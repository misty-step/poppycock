name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact same-repository release PR commit to verify
        required: true
        type: string
      backend_preview:
        description: Deploy and exercise only the isolated synthetic Cloudflare backend preview
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    runs-on: [self-hosted, hetzner-ci, poppycock-ci]
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Only the job's anonymous local backend; no cloud credentials or services.
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3220
      NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3221
      POPPYCOCK_EVIDENCE_DIR: test-results/multiplayer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Refuse moved release PR head
        env:
          EXPECTED: ${{ inputs.ref || github.sha }}
          EVENT_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then test "$EXPECTED" = "$EVENT_HEAD"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Build genuine vendored Parlor packages
        run: pnpm build:parlor
      - name: Typecheck vendored Parlor packages
        run: pnpm --filter './vendor/parlor/**' -r exec tsc --noEmit -p tsconfig.json
      - name: Exercise vendored Parlor contracts
        run: pnpm test:parlor
      - name: Typecheck Poppycock
        run: pnpm typecheck
      - name: Typecheck the native Worker boundary
        run: pnpm typecheck:worker
      - name: Exercise game and issuer contracts
        run: pnpm test
      - name: Exercise the same game contracts on the Cloudflare adapter
        run: pnpm test:backend:cloudflare
        env:
          POPPYCOCK_SYNTHETIC_FIXTURE: "1"
      - name: Build the deployable Worker once
        run: |
          if test "$BACKEND_PREVIEW" = true; then
            node scripts/deploy-cloudflare.mjs --build-only --backend-preview
          else
            node scripts/deploy-cloudflare.mjs --build-only
          fi
        env:
          POPPYCOCK_REVISION: ${{ inputs.ref || github.sha }}
          BACKEND_PREVIEW: ${{ inputs.backend_preview || false }}
      - name: Verify the Worker artifact in an isolated runtime
        run: node scripts/verify-worker.mjs
        env:
          POPPYCOCK_REVISION: ${{ inputs.ref || github.sha }}
          POPPYCOCK_BACKEND_PREVIEW: ${{ inputs.backend_preview || false }}
      - uses: actions/upload-artifact@v4
        with:
          name: worker-${{ inputs.ref || github.sha }}
          path: .open-next/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.backend_preview
        with:
          name: synthetic-catalog-${{ inputs.ref || github.sha }}
          path: test-results/cloudflare-fixture/
          if-no-files-found: error
      - name: Install isolated browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Play a real multiplayer game against anonymous local Convex
        run: pnpm smoke:local
        env:
          POPPYCOCK_REVISION: ${{ inputs.ref || github.sha }}
      - name: Retain sanitized browser and scoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-evidence-${{ github.sha }}
          path: test-results/multiplayer/
          if-no-files-found: ignore

  backend-preview:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.backend_preview
    concurrency:
      group: backend-preview
      cancel-in-progress: false
    runs-on: [self-hosted, hetzner-ci, poppycock-ci]
    timeout-minutes: 20
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      POPPYCOCK_CLOUDFLARE_PREVIEW_ORIGIN: https://poppycock-backend-preview.mistystep.io
      POPPYCOCK_REVISION: ${{ inputs.ref }}
      POPPYCOCK_EVIDENCE_DIR: test-results/backend-preview/browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: test "$(git rev-parse HEAD)" = "$POPPYCOCK_REVISION"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:parlor
      - uses: actions/download-artifact@v4
        with:
          name: worker-${{ inputs.ref }}
          path: .open-next/
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-catalog-${{ inputs.ref }}
          path: test-results/cloudflare-fixture/
      - name: Deploy only the isolated preview and its preview-only bindings
        run: |
          pnpm exec wrangler deploy --config wrangler.backend-preview.jsonc --message "$POPPYCOCK_REVISION"
          node scripts/backend-preview.mjs --bind-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POPPYCOCK_PREVIEW_BACKEND_ADMIN_KEY: ${{ secrets.POPPYCOCK_PREVIEW_BACKEND_ADMIN_KEY }}
          POPPYCOCK_PREVIEW_PARLOR_GUEST_TOKEN_KEYS: ${{ secrets.POPPYCOCK_PREVIEW_PARLOR_GUEST_TOKEN_KEYS }}
          POPPYCOCK_PREVIEW_CONTINUITY_SECRET: ${{ secrets.POPPYCOCK_PREVIEW_CONTINUITY_SECRET }}
          POPPYCOCK_SENTRY_DSN: ${{ secrets.POPPYCOCK_SENTRY_DSN }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prove hosted gameplay, rejection, repeatable recovery and PITR undo
        run: node scripts/backend-preview.mjs
        env:
          POPPYCOCK_PREVIEW_BACKEND_ADMIN_KEY: ${{ secrets.POPPYCOCK_PREVIEW_BACKEND_ADMIN_KEY }}
          POPPYCOCK_PREVIEW_ACCESS_CLIENT_ID: ${{ secrets.POPPYCOCK_PREVIEW_ACCESS_CLIENT_ID }}
          POPPYCOCK_PREVIEW_ACCESS_CLIENT_SECRET: ${{ secrets.POPPYCOCK_PREVIEW_ACCESS_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-preview-evidence-${{ inputs.ref }}
          path: test-results/backend-preview/
          if-no-files-found: error

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: production
      cancel-in-progress: false
    runs-on: [self-hosted, hetzner-ci, poppycock-ci]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Build vendored Parlor for Convex deployment
        run: pnpm build:parlor
      - uses: actions/download-artifact@v4
        with:
          name: worker-${{ github.sha }}
          path: .open-next/
      - name: Deploy compatible backend, promote tested Worker, read back or roll back
        run: node scripts/promote.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          POPPYCOCK_PRODUCTION_BACKEND_ADMIN_KEY: ${{ secrets.POPPYCOCK_PRODUCTION_BACKEND_ADMIN_KEY }}
          POPPYCOCK_PARLOR_GUEST_TOKEN_KEYS: ${{ secrets.POPPYCOCK_PARLOR_GUEST_TOKEN_KEYS }}
          POPPYCOCK_CONTINUITY_SECRET: ${{ secrets.POPPYCOCK_CONTINUITY_SECRET }}
          POPPYCOCK_SENTRY_DSN: ${{ secrets.POPPYCOCK_SENTRY_DSN }}
          POPPYCOCK_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-${{ github.sha }}
          path: test-results/deployment.json
          if-no-files-found: ignore
